name: Deploy demo report to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run pipeline (extract -> transform -> validate -> aggregate)
        run: |
          python -m pokemon_pipeline canalave-city-area
          python -m pokemon_pipeline.transform
          python -m pokemon_pipeline.validate canalave-city-area
          python -m pokemon_pipeline.aggregate

      - name: Generate report
        run: python -m pokemon_pipeline.report

      - name: Generate static report
        run: python scripts/generate_report.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4